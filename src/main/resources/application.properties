spring.application.name=Book Api

spring.datasource.url=jdbc:h2:mem:bookdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.flyway.enabled=true

#Generate secret using "openssl rand -base64 32" on macOS
security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value}
security.jwt.issuer=${JWT_ISSUER:book-api}
security.jwt.expiration=${JWT_EXPIRATION:PT15M}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
